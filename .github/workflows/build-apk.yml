name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: companion-release-main
  cancel-in-progress: true

env:
  SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK for testing
        run: gradle :app:assembleDebug

      - name: Test offline conversation engine
        run: gradle :app:testDebugUnitTest

      - name: Surface test failure
        if: failure()
        run: |
          FAILURE=$(python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              for case in ET.parse(path).findall('.//testcase'):
                  failure = case.find('failure')
                  if failure is not None:
                      print(f"{case.attrib.get('name')}: {failure.attrib.get('message', failure.text or '')}".replace('\n', ' ')[:500])
                      raise SystemExit
          PY
          )
          echo "::error title=Offline conversation test::$FAILURE"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CompanheiroFala-test-report
          path: app/build/reports/tests/testDebugUnitTest

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CompanheiroFala-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Restore secure signing key
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/companheiro-release.jks"

      - name: Build signed release APK
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/companheiro-release.jks
        run: gradle :app:assembleRelease

      - name: Prepare signed APK
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: cp app/build/outputs/apk/release/app-release.apk CompanheiroFala.apk

      - name: Upload signed APK artifact
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: CompanheiroFala-release
          path: CompanheiroFala.apk

      - name: Publish GitHub Release for in-app updates
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          TAG="v$VERSION"
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" CompanheiroFala.apk --title "Companheiro Fala $TAG" --notes "Atualização automática do Companheiro Fala."
